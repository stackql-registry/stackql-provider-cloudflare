# Response-shape fixes for resources whose SELECT yields no columns.
#
# Consumed by stackql_cloudflare_provider/select_response_fixes.py (a
# generate-provider post-pass). Each entry targets one operation
# (service yaml + path + verb) and applies one fix kind:
#
#   item_schema          - replace the untyped `result.items` in the op's 200
#                          envelope with the given typed schema (objectKey
#                          $.result comes from the CSV). Use when the real
#                          response shape is known but upstream declares
#                          `{type: object}` items.
#   scalar_rows          - result is an array of scalars: transform each
#                          element into a row with the given column name.
#   result_to_contents   - result is an untyped/dynamic object or bare string:
#                          project the whole `result` as a single row with a
#                          `contents` column.
#   array_items_contents - result is an array of untyped objects (dynamic row
#                          shapes, e.g. SQL query rows): one row per element,
#                          each as a `contents` column.
#   contents             - project the entire response body as a single
#                          `contents` row (raw text / NDJSON responses).
#   add_200_contents     - the op declares no 200 content at all: declare a
#                          `{contents}` schema and wrap the raw body.
#
# All kinds except item_schema clear the method's objectKey and attach a
# response transform (binary_responses.py pattern).

fixes:
  # --- ai model catalog (typed shapes confirmed live 2026-07-20) ---
  - service: ai
    path: /accounts/{account_id}/ai/models/search
    verb: get
    kind: item_schema
    schema:
      type: object
      properties:
        id: {type: string, description: Model identifier (UUID).}
        source: {type: number}
        name: {type: string, description: "Model name, e.g. @cf/meta/llama-3.2-1b-instruct - use as model_name in the ai task-family resources."}
        description: {type: string}
        task:
          type: object
          description: "Task grouping: id, name (e.g. Text Generation), description."
        created_at: {type: string}
        tags: {type: array, items: {type: string}}
        properties: {type: array, items: {type: object}}
  - service: ai
    path: /accounts/{account_id}/ai/tasks/search
    verb: get
    kind: item_schema
    schema:
      type: object
      properties:
        id: {type: string, description: Task identifier (UUID).}
        name: {type: string, description: "Task name, e.g. Text Generation."}
        description: {type: string}
  - service: ai
    path: /accounts/{account_id}/ai/authors/search
    verb: get
    kind: scalar_rows
    column: author

  # --- scalar-array results -> rows ---
  - service: resource_tagging
    path: /accounts/{account_id}/tags/keys
    verb: get
    kind: scalar_rows
    column: key
  - service: resource_tagging
    path: /accounts/{account_id}/tags/values/{tag_key}
    verb: get
    kind: scalar_rows
    column: value
  - service: browser_rendering
    path: /accounts/{account_id}/browser-rendering/links
    verb: post
    kind: scalar_rows
    column: link

  # --- untyped / string / dynamic result objects -> contents ---
  - {service: ssl, path: "/zones/{zone_id}/ssl/analyze", verb: post, kind: result_to_contents}
  - {service: browser_rendering, path: "/accounts/{account_id}/browser-rendering/content", verb: post, kind: result_to_contents}
  - {service: browser_rendering, path: "/accounts/{account_id}/browser-rendering/markdown", verb: post, kind: result_to_contents}
  - {service: browser_rendering, path: "/accounts/{account_id}/browser-rendering/json", verb: post, kind: result_to_contents}
  - {service: alerting, path: "/accounts/{account_id}/alerting/v3/available_alerts", verb: get, kind: result_to_contents}
  - {service: zero_trust, path: "/accounts/{account_id}/devices/{device_id}/override_codes", verb: get, kind: result_to_contents}
  - {service: zero_trust, path: "/accounts/{account_id}/devices/registrations/{registration_id}/override_codes", verb: get, kind: result_to_contents}
  - {service: cloudforce_one, path: "/accounts/{account_id}/cloudforce-one/events/attackers", verb: get, kind: result_to_contents}
  - {service: cloudforce_one, path: "/accounts/{account_id}/cloudforce-one/events/countries", verb: get, kind: result_to_contents}
  - {service: cloudforce_one, path: "/accounts/{account_id}/cloudforce-one/events/categories", verb: get, kind: result_to_contents}
  - {service: cloudforce_one, path: "/accounts/{account_id}/cloudforce-one/events/targetIndustries", verb: get, kind: result_to_contents}
  - {service: cloudforce_one, path: "/accounts/{account_id}/cloudforce-one/events/indicatorTypes", verb: get, kind: result_to_contents}
  - {service: cloudforce_one, path: "/accounts/{account_id}/cloudforce-one/events/dataset/{dataset_id}/indicators/tags", verb: get, kind: result_to_contents}
  - {service: cloudforce_one, path: "/accounts/{account_id}/cloudforce-one/events/dataset", verb: get, kind: result_to_contents}

  # --- dynamic row arrays -> one contents row per element ---
  - {service: logs, path: "/accounts/{account_id}/logs/explorer/query/sql", verb: post, kind: array_items_contents}
  - {service: logs, path: "/zones/{zone_id}/logs/explorer/query/sql", verb: post, kind: array_items_contents}

  # --- raw text / NDJSON bodies -> whole-body contents ---
  - {service: logs, path: "/zones/{zone_id}/logs/received", verb: get, kind: contents}
  - {service: logs, path: "/zones/{zone_id}/logs/rayids/{ray_id}", verb: get, kind: contents}

  # --- no declared 200 content -> declare + wrap ---
  - {service: network_interconnects, path: "/accounts/{account_id}/cni/interconnects/{icon}/loa", verb: get, kind: add_200_contents}
  - {service: browser_rendering, path: "/accounts/{account_id}/browser-rendering/devtools/browser/{session_id}/json/list", verb: get, kind: add_200_contents}
