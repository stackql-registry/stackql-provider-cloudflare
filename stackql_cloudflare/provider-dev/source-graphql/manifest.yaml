# Manifest of Cloudflare GraphQL operations to expose through the stackql
# provider. See stackql_cloudflare_provider/graphql_merge.py for the
# merge step that consumes this file.
#
# Key fields:
#   field           - GraphQL field name on viewer.{zones,accounts}[0]
#   scope           - 'zone' or 'account'
#   service         - target stackql service
#   resource        - target stackql resource name
#   method          - target stackql method name
#   spec            - path to per-op spec, relative to source-graphql/
#   replaces_rest   - optional list of upstream REST (path, verb) entries
#                     superseded by this op. Listed paths are STRIPPED from
#                     provider-dev/source/<service>.yaml and from
#                     provider-dev/config/all_services.csv before the
#                     downstream provider generation runs, so the broken /
#                     superseded endpoints never reach the user-facing
#                     surface. See strip_superseded_rest.py.

operations:
  - field: httpRequestsAdaptiveGroups
    scope: zone
    service: zones
    resource: http_requests_adaptive_groups
    method: list
    spec: ops/http_requests_adaptive_groups.yaml
    replaces_rest:
      - { path: '/zones/{zone_identifier}/analytics/dashboard', verb: get }

  - field: firewallEventsAdaptiveGroups
    scope: zone
    service: firewall
    resource: firewall_events_adaptive_groups
    method: list
    spec: ops/firewall_events_adaptive_groups.yaml

  - field: httpRequests1hGroups
    scope: zone
    service: zones
    resource: http_requests_1h_groups
    method: list
    spec: ops/http_requests_1h_groups.yaml

  - field: firewallEventsAdaptive
    scope: zone
    service: firewall
    resource: firewall_events
    method: list
    spec: ops/firewall_events_adaptive.yaml

  - field: httpRequestsOverviewAdaptiveGroups
    scope: zone
    service: zones
    resource: http_requests_overview_adaptive_groups
    method: list
    spec: ops/http_requests_overview_adaptive_groups.yaml
    replaces_rest:
      - { path: '/zones/{zone_identifier}/analytics/colos', verb: get }

  - field: dnsAnalyticsAdaptiveGroups
    scope: zone
    service: dns
    resource: dns_analytics_adaptive_groups
    method: list
    spec: ops/dns_analytics_adaptive_groups.yaml

  - field: workersInvocationsAdaptive
    scope: account
    service: workers
    resource: workers_invocations
    method: list
    spec: ops/workers_invocations_adaptive.yaml

  - field: r2OperationsAdaptiveGroups
    scope: account
    service: r2
    resource: r2_operations_adaptive_groups
    method: list
    spec: ops/r2_operations_adaptive_groups.yaml

  - field: d1AnalyticsAdaptiveGroups
    scope: account
    service: d1
    resource: d1_analytics_adaptive_groups
    method: list
    spec: ops/d1_analytics_adaptive_groups.yaml

  - field: cdnNetworkAnalyticsAdaptiveGroups
    scope: account
    service: cache
    resource: cdn_network_analytics_adaptive_groups
    method: list
    spec: ops/cdn_network_analytics_adaptive_groups.yaml
